when:
  - event: push
    branch: main

labels:
  platform: linux/amd64

steps:
  # WAL-72/WAL-70: mint a short-lived, down-scoped GitHub App installation token
  # (product-ci profile: contents=write,metadata=read) in place of the shared
  # admin PAT. Minter is vendored in the woodpecker-release plugin image; GH_APP_*
  # are org-level Woodpecker secrets. Token (~1h TTL) lands in the shared workspace.
  - name: mint-token
    image: ghcr.io/barryw/woodpecker-release:go
    pull: true
    environment:
      GH_APP_ID:
        from_secret: gh_app_id
      GH_APP_INSTALLATION_ID:
        from_secret: gh_app_installation_id
      GH_APP_PRIVATE_KEY:
        from_secret: gh_app_private_key
    commands:
      - /plugin/mint-installation-token.sh --profile product-ci > "$CI_WORKSPACE/.ci-token"
      - 'test -s "$CI_WORKSPACE/.ci-token" || { echo "FATAL: empty minted token"; exit 1; }'

  - name: create-draft-release
    image: alpine:3.19
    commands:
      - export GITHUB_TOKEN=$(cat "$CI_WORKSPACE/.ci-token")
      - apk add --no-cache bash ca-certificates git github-cli
      - git fetch --tags
      - VERSION=$$(bash scripts/compute-version.sh)
      - echo "Creating draft release $${VERSION}"
      # Generate release notes from commit messages since last tag
      - |
        PREV_TAG=$$(git tag -l 'vice-mcp-*' --sort=-v:refname | head -1 || true)
        if [ -n "$${PREV_TAG}" ]; then
          NOTES=$$(git log "$${PREV_TAG}..HEAD" --pretty=format:"- %s" --no-merges)
        else
          NOTES=$$(git log --pretty=format:"- %s" --no-merges -20)
        fi
        if [ -z "$${NOTES}" ]; then
          NOTES="No changes since last release."
        fi
      # Delete any orphaned draft releases from previous failed pipelines
      - |
        for tag in $$(gh release list --repo "$${CI_REPO}" --json tagName,isDraft --jq '.[] | select(.isDraft) | .tagName'); do
          echo "Deleting orphaned draft: $${tag}"
          gh release delete "$${tag}" --repo "$${CI_REPO}" --yes 2>/dev/null || true
        done
      - |
        if gh release view "$${VERSION}" --repo "$${CI_REPO}" >/dev/null 2>&1; then
          echo "Release $${VERSION} already exists, skipping creation"
        else
          gh release create "$${VERSION}" \
            --repo "$${CI_REPO}" \
            --target "$${CI_COMMIT_SHA}" \
            --title "$${VERSION}" \
            --notes "$${NOTES}" \
            --draft
        fi
