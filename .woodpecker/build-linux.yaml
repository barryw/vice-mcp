when:
  - event: push
    branch: main

depends_on:
  - create-release

labels:
  platform: linux/amd64

steps:
  - name: build-and-package
    image: debian:12
    backend_options:
      kubernetes:
        node_selector:
          ci-role: linux
    commands:
      - apt-get update
      - >-
        apt-get install -y --no-install-recommends
        autoconf
        automake
        build-essential
        ca-certificates
        bison
        byacc
        dos2unix
        flex
        git
        libasound2-dev
        libcap-dev
        libcurl4-openssl-dev
        libevdev-dev
        libflac-dev
        libgif-dev
        libglew-dev
        libgtk-3-dev
        libieee1284-3-dev
        libmicrohttpd-dev
        libmp3lame-dev
        libmpg123-dev
        libpcap-dev
        libpng-dev
        libpulse-dev
        libusb-1.0-0-dev
        libvorbis-dev
        pkg-config
        portaudio19-dev
        xa65
        zip
      - cd vice
      - rm -rf build-gui build-headless
      - rm -f src/config.h
      - find . -name config.status -exec rm -f {} +
      - ./src/buildtools/genvicedate_h.sh
      # Regenerate all autotools output from source, including
      # AX_SUBDIRS_CONFIGURE subprojects such as src/lib/libresidfp,
      # then fix timestamps so make doesn't re-run autotools
      # (CI automake version may differ from upstream's)
      - ./autogen.sh
      - sleep 1 && find . -name aclocal.m4 -exec touch {} +
      - sleep 1 && find . -name configure -exec touch {} + && find . -name config.h.in -exec touch {} +
      - find . -name Makefile.in -exec touch {} +
      # Regenerate bison-generated parsers to avoid stale .c files
      - bison -d -o src/monitor/mon_parse.c src/monitor/mon_parse.y
      - cd ..
      - git fetch --tags
      - VERSION=$$(bash scripts/compute-version.sh --current)
      - cd vice
      # --- GUI build ---
      - mkdir -p build-gui && cd build-gui
      - >-
        ../configure
        --enable-option-checking=fatal
        --enable-gtk3ui
        --enable-mcp-server
        --enable-cpuhistory
        --enable-ethernet
        --enable-midi
        --enable-parsid
        --enable-catweasel
        --disable-arch
        --disable-pdf-docs
        --disable-html-docs
        --with-alsa
        --with-fastsid
        --with-flac
        --with-gif
        --with-lame
        --with-libcurl
        --with-libieee1284
        --with-mpg123
        --with-png
        --with-portaudio
        --with-pulse
        --with-resid
        --with-vorbis
      - make -j$$(nproc) -s
      - make DESTDIR=$${PWD}/install-tree install-strip
      - cd install-tree
      - find . -type f -exec sha256sum {} + > SHA256SUMS
      - zip -r "../../../$${VERSION}-linux-x86_64-gui.zip" .
      - cd ../../..
      - cd vice
      # --- Headless build ---
      - mkdir -p build-headless && cd build-headless
      - >-
        ../configure
        --enable-option-checking=fatal
        --enable-headlessui
        --enable-mcp-server
        --enable-cpuhistory
        --enable-ethernet
        --enable-midi
        --enable-parsid
        --enable-catweasel
        --disable-arch
        --disable-pdf-docs
        --disable-html-docs
        --with-alsa
        --with-fastsid
        --with-flac
        --with-gif
        --with-lame
        --with-libcurl
        --with-libieee1284
        --with-mpg123
        --with-png
        --with-portaudio
        --with-pulse
        --with-resid
        --with-vorbis
      - make -j$$(nproc) -s
      - make DESTDIR=$${PWD}/install-tree install-strip
      - cd install-tree
      - find . -type f -exec sha256sum {} + > SHA256SUMS
      - zip -r "../../../$${VERSION}-linux-x86_64-headless.zip" .
      - cd ../../..
      - ls -lh $${VERSION}-linux-x86_64-*.zip

  # WAL-72/WAL-70: mint a short-lived GitHub App installation token (product-ci
  # profile) just before upload in place of the shared admin PAT. Same node
  # selector as upload so the workspace token file is co-located.
  - name: mint-token
    image: ghcr.io/barryw/woodpecker-release:go
    pull: true
    backend_options:
      kubernetes:
        node_selector:
          ci-role: linux
    environment:
      GH_APP_ID:
        from_secret: gh_app_id
      GH_APP_INSTALLATION_ID:
        from_secret: gh_app_installation_id
      GH_APP_PRIVATE_KEY:
        from_secret: gh_app_private_key
    commands:
      - /plugin/mint-installation-token.sh --profile product-ci > "$CI_WORKSPACE/.ci-token"
      - 'test -s "$CI_WORKSPACE/.ci-token" || { echo "FATAL: empty minted token"; exit 1; }'

  - name: upload
    image: alpine:3.19
    backend_options:
      kubernetes:
        node_selector:
          ci-role: linux
    commands:
      - export GITHUB_TOKEN=$(cat "$CI_WORKSPACE/.ci-token")
      - apk add --no-cache bash ca-certificates git github-cli
      - git fetch --tags
      - VERSION=$$(bash scripts/compute-version.sh --current)
      - |
        for f in $${VERSION}-linux-x86_64-*.zip; do
          gh release upload "$${VERSION}" "$${f}" --repo "$${CI_REPO}" --clobber
        done
