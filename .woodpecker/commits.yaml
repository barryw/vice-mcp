# Conventional Commits — validate commit messages on every push.
#
# CI safety net for the Walker Heavy Industries Build & Release Standard.
# Developers should also install the local hook: `cog install-hook --all`.
# Check this branch's commits since the latest v tag. Imported upstream
# history does not follow Conventional Commits and must not fail our checks.
when:
  - event: push

labels:
  platform: linux/amd64

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      tags: true
      depth: 0

steps:
  - name: validate-commits
    image: ghcr.io/cocogitto/cog:latest
    commands:
      - git config user.name "Woodpecker CI"
      - git config user.email "ci@walkerheavy.com"
      - |
        VERSION=$$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1)
        for commit in $$(git rev-list --first-parent --no-merges "$${VERSION}..HEAD"); do
          git show -s --format=%B "$${commit}" | cog verify --file - || exit 1
        done
      - echo "All commits follow conventional commit format"
