when:
  - event: push
    branch: main

depends_on:
  - release

labels:
  platform: linux/amd64

steps:
  - name: build-and-package
    image: fedora:41
    backend_options:
      kubernetes:
        node_selector:
          ci-role: windows
    commands:
      # Install cross-compiler toolchain and dependencies
      - >-
        dnf install -y --setopt=install_weak_deps=False
        gcc gcc-c++ autoconf automake make pkg-config xa icoutils
        flex bison dos2unix git zip curl ca-certificates
        mingw64-gcc mingw64-gcc-c++
        mingw64-curl mingw64-flac mingw64-portaudio
        mingw64-giflib mingw64-libvorbis mingw64-libpng
      # Cross-compile libmicrohttpd (no Fedora mingw64 package available)
      - bash scripts/build-windows-cross.sh build-libmicrohttpd
      # Cross-compile VICE headless
      - bash scripts/build-windows-cross.sh build
      # Package into zip with DLLs and data files
      - bash scripts/build-windows-cross.sh package

  # WAL-72/WAL-70: mint a short-lived GitHub App installation token (product-ci
  # profile) just before upload in place of the shared admin PAT. This is a Linux
  # cross-compile node (the windows label is a node role, not a Windows host), so
  # the minter plugin image runs here. Same node selector co-locates the token.
  - name: mint-token
    image: ghcr.io/barryw/woodpecker-release:go
    pull: true
    backend_options:
      kubernetes:
        node_selector:
          ci-role: windows
    environment:
      GH_APP_ID:
        from_secret: gh_app_id
      GH_APP_INSTALLATION_ID:
        from_secret: gh_app_installation_id
      GH_APP_PRIVATE_KEY:
        from_secret: gh_app_private_key
    commands:
      - /plugin/mint-installation-token.sh --profile product-ci > "$CI_WORKSPACE/.ci-token"
      - 'test -s "$CI_WORKSPACE/.ci-token" || { echo "FATAL: empty minted token"; exit 1; }'

  - name: upload
    image: fedora:41
    backend_options:
      kubernetes:
        node_selector:
          ci-role: windows
    commands:
      - export GITHUB_TOKEN=$(cat "$CI_WORKSPACE/.ci-token")
      - dnf install -y --setopt=install_weak_deps=False git gh bash
      - bash scripts/build-windows-cross.sh upload
