when:
  - event: push
    branch: main

depends_on:
  - build-linux
  - build-macos
  - build-windows

labels:
  platform: linux/amd64

steps:
  # WAL-72/WAL-70: mint a short-lived GitHub App installation token (product-ci
  # profile) in place of the shared admin PAT. See create-release.yaml.
  - name: mint-token
    image: ghcr.io/barryw/woodpecker-release:go
    pull: true
    environment:
      GH_APP_ID:
        from_secret: gh_app_id
      GH_APP_INSTALLATION_ID:
        from_secret: gh_app_installation_id
      GH_APP_PRIVATE_KEY:
        from_secret: gh_app_private_key
    commands:
      - /plugin/mint-installation-token.sh --profile product-ci > "$CI_WORKSPACE/.ci-token"
      - 'test -s "$CI_WORKSPACE/.ci-token" || { echo "FATAL: empty minted token"; exit 1; }'

  - name: publish-release
    image: alpine:3.19
    commands:
      - export GITHUB_TOKEN=$(cat "$CI_WORKSPACE/.ci-token")
      - apk add --no-cache bash ca-certificates git github-cli
      - git fetch --tags
      - VERSION=$$(bash scripts/compute-version.sh --current)
      - echo "Publishing release $${VERSION}"
      - gh release edit "$${VERSION}" --draft=false --prerelease=false --latest=false --repo "$${CI_REPO}"
